name: Pulse Main Branch Monitor

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  monitor-main:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Syntax check source files
        run: |
          for f in $(find src -name "*.js"); do
            node --check "$f"
          done

      - name: Run test suite
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://127.0.0.1:27017/shop-api-ci
          JWT_SECRET: pulse-main-test-secret
        run: npm run test:data
